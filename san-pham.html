<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết sản phẩm | Tiệm len của Baoyuu</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #fff; color: #222; }
    .top { background: #f7c8d3; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .top a { color: #222; text-decoration: none; font-weight: 700; }
    .wrap { max-width: 1000px; margin: 32px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    .photo img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 24px; background: #f7c8d3; }
    .cat { color: #A8B58A; font-weight: 700; margin: 0 0 8px; }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    .price { font-size: 1.6rem; font-weight: 700; color: #c2476a; margin: 0 0 20px; }
    .desc { line-height: 1.6; margin-bottom: 20px; }
    .specs { list-style: none; padding: 0; margin: 0 0 24px; }
    .specs li { padding: 8px 0; border-bottom: 1px solid #eee; }
    .specs b { display: inline-block; width: 110px; }
    .buy { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .qty { display: flex; align-items: center; border: 1.5px solid #ccc; border-radius: 10px; overflow: hidden; }
    .qty button { width: 38px; height: 42px; border: 0; background: #fff; font-size: 1.2rem; cursor: pointer; }
    .qty span { min-width: 40px; text-align: center; font-weight: 700; }
    #addBtn { flex: 1; min-width: 180px; height: 46px; border: 0; border-radius: 10px; background: #A8B58A; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; }
    #addBtn:hover { filter: brightness(.95); }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #A8B58A; color: #fff; padding: 12px 22px; border-radius: 999px; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.2); display: none; z-index: 99; }
    .toast a { color: #fff; margin-left: 10px; }
    .notfound { text-align: center; padding: 80px 20px; }
    @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; gap: 20px; } }
  </style>
</head>
<body>
  <div class="top">
    <a href="index.html">← Về trang chủ</a>
    <a href="index.html#shop">Tiệm len của Baoyuu</a>
  </div>

  <div id="app"></div>
  <div class="toast" id="toast"></div>

  <script src="products.js"></script>
  <script>
    const app = document.getElementById("app");
    const id = new URLSearchParams(location.search).get("id");
    const p = PRODUCTS[id];
    const money = (n) => n.toLocaleString("vi-VN") + "đ";

    if (!p) {
      app.innerHTML =
        '<div class="notfound"><h2>Không tìm thấy sản phẩm</h2>' +
        '<p><a href="index.html">Quay về trang chủ</a></p></div>';
    } else {
      document.title = p.name + " | Tiệm len của Baoyuu";

      // dùng textContent để chữ trong dữ liệu không làm vỡ trang
      const el = (tag, cls, text) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      };

      const wrap = el("div", "wrap");

      const photo = el("div", "photo");
      const img = document.createElement("img");
      img.src = p.img;
      img.alt = p.name;
      photo.appendChild(img);

      const info = el("div", "info");
      info.append(
        el("p", "cat", p.category),
        el("h1", "", p.name),
        el("p", "price", money(p.price)),
        el("p", "desc", p.desc)
      );

      const specs = el("ul", "specs");
      [["Chất liệu", p.material], ["Kích thước", p.size], ["Hình thức", "Làm thủ công (handmade)"]]
        .forEach(([k, v]) => {
          if (!v) return;
          const li = document.createElement("li");
          li.append(el("b", "", k), document.createTextNode(v));
          specs.appendChild(li);
        });
      info.appendChild(specs);

      // chọn số lượng + nút thêm vào giỏ
      let qty = 1;
      const buy = el("div", "buy");
      const qtyBox = el("div", "qty");
      const minus = el("button", "", "−"); minus.type = "button";
      const num = el("span", "", "1");
      const plus = el("button", "", "+"); plus.type = "button";
      qtyBox.append(minus, num, plus);
      const addBtn = el("button", "", "🛒 Thêm vào giỏ hàng");
      addBtn.id = "addBtn"; addBtn.type = "button";
      buy.append(qtyBox, addBtn);
      info.appendChild(buy);

      minus.onclick = () => { if (qty > 1) num.textContent = --qty; };
      plus.onclick = () => { num.textContent = ++qty; };

      addBtn.onclick = () => {
        let cart = [];
        try { cart = JSON.parse(localStorage.getItem("cart") || "[]"); } catch (e) { cart = []; }

        const found = cart.find((i) => i.id === id);
        if (found) found.quantity += qty;
        else cart.push({ id, name: p.name, price: p.price, img: p.img, quantity: qty });

        try { localStorage.setItem("cart", JSON.stringify(cart)); } catch (e) {}

        const t = document.getElementById("toast");
        t.innerHTML = 'Đã thêm vào giỏ hàng <a href="index.html">Xem trang chủ</a>';
        t.style.display = "block";
        clearTimeout(t._timer);
        t._timer = setTimeout(() => (t.style.display = "none"), 2500);
      };

      wrap.append(photo, info);
      app.appendChild(wrap);
    }
  </script>
</body>
</html>
