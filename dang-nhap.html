<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | MY SHOP</title>
    <link
     rel="stylesheet" 
     href="style2.css">

</head>
<body>
    <main class="card">
        <div class="container">
            <aside class="left">
               <div class="logo">
                  <img 
                  src="logo 1.jpg"
                  alt="logo">
                  <strong>MY SHOP</strong>
               </div>

               <nav class="menu">
                  <a href="index.html">Trang chủ</a>
                  <a href="index.html #shop">Gian hàng</a>
                  <a href="account.html">Tài khoản</a>
               </nav>
            </aside>
        </div>

        <h1>Đăng nhập</h1>
        <p class="sub">Chưa có tài khoản? <a href="account.html">Đăng ký</a></p>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" autocomplete="email" placeholder="baoyuu@example.com">
                <small class="error" id="err-email"></small>
            </div>

            <div class="field">
                <label for="password">Mật khẩu</label>
                <input id="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu">
                <small class="error" id="err-password"></small>
            </div>

            <div class="row">
                <label class="check">
                <input id="remember" type="checkbox">
                <span>Ghi nhớ đăng nhập</span>
                </label>
                <a href="#">Quên mật khẩu?</a>
            </div>

            <button type="submit">Đăng nhập</button>
            <p id="result"></p>
        </form>
  </main>

  <script src="dang-nhap.js"></script>
</body>
</html>
