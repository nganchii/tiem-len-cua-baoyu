<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> My account</title>
    <link 
     rel="stylesheet" 
     href="style2.css">
</head>
<body>
    <main class="card">
        <div class="container">
            <aside class="left">
               <div class="logo">
                  <img 
                  src="logo 1.jpg"
                  alt="logo">
                  <strong>MY SHOP</strong>
               </div>

               <nav class="menu">
                  <a href="index.html">Trang chủ</a>
                  <a href="index.html #shop">Gian hàng</a>
                  <a href="account.html">Tài khoản</a>
               </nav>
            </aside>
        </div>
        <section>
            <h1> Tạo tài khoản </h1>
            <p class="sub">Đã có tài khoản <a href="dang-nhap.html"> Đăng nhập </a></p>

            <form id="registerForm" novalidate>
                <div class="field">
                    <label for="name">Họ và tên</label>
                    <input id="name" type="text" autocomplete="name" placeholder="VD: Nguyễn Văn A">
                    <small class="error" id="err-name"></small>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" autocomplete="email" placeholder="baoyuu@example.com">
                    <small class="error" id="err-email"></small>
                </div>

                <div class="field">
                    <label for="phone">Số điện thoại</label>
                    <input id="phone" type="tel" autocomplete="tel" placeholder="0912345678">
                    <small class="error" id="err-phone"></small>
                </div>

                <div class="field">
                    <label for="password">Mật khẩu</label>
                    <input id="password" type="password" autocomplete="new-password" placeholder="Ít nhất 8 ký tự">
                    <small class="error" id="err-password"></small>
                </div>

                <div class="field">
                    <label for="confirm">Nhập lại mật khẩu</label>
                    <input id="confirm" type="password" autocomplete="new-password">
                    <small class="error" id="err-confirm"></small>
                </div>

                <label class="check">
                    <input id="agree" type="checkbox">
                    <span>Tôi đồng ý với <a href="#">Điều khoản</a> và <a href="#">Chính sách bảo mật</a></span>
                </label>
                <small class="error" id="err-agree"></small>

                <button type="submit">Tạo tài khoản</button>
                <p id="result"></p>
            </form>
        </section>
    </main>
    <script src="script2.js"></script>
</body>
</html>
